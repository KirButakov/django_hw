{% extends 'catalog/base.html' %}
{% block content %}
    <h2>Подтверждение удаления</h2>
    <p>Вы уверены, что хотите удалить "{{ object.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Удалить</button>
        <a href="{% url 'blog_post_list' %}">Отмена</a>
    </form>
{% endblock %}
