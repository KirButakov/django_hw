{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'catalog/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'users/css/styles.css' %}">  <!-- Подключение стилей для форм -->
    <title>{% block title %}Каталог{% endblock %}</title>
</head>
<body>
    <header>
        {% block header %}
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <a class="navbar-brand" href="{% url 'home' %}">Главная</a>
                <div class="navbar-nav">
                    <a class="nav-item nav-link" href="{% url 'product_list' %}">Продукты</a>
                    <a class="nav-item nav-link" href="{% url 'blogs:blog_post_list' %}">Блог</a>
                </div>
                <div class="navbar-nav ml-auto">
                    {% if user.is_authenticated %}
                        <form action="{% url 'logout' %}" method="post" style="display: inline;">
                            {% csrf_token %}
                            <button type="submit" class="nav-item nav-link btn btn-link" style="border: none; padding: 0; background: none; cursor: pointer;">
                                Выход
                            </button>
                        </form>
                    {% else %}
                        <a class="nav-item nav-link" href="{% url 'login' %}">Вход</a>
                        <a class="nav-item nav-link" href="{% url 'register' %}">Регистрация</a>
                    {% endif %}
                </div>
            </nav>
        {% endblock %}
    </header>
    <main class="container mt-5">
        {% block content %}{% endblock %}
    </main>
    <footer class="mt-5">
        <p class="text-center">© 2025 Каталог</p>
    </footer>
</body>
</html>
